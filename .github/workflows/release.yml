name: Release

# Cutting a release (docs/RELEASING.md): finalize CHANGELOG.md + bump the
# CMake project version on main, then `git tag X.Y.Z && git push --tags`.
# This workflow creates the GitHub release with that version's changelog
# section as the body and attaches self-contained Linux and macOS builds.
# The Windows build is statically linked against Qt, which CI can't produce;
# it's built locally and uploaded to the release manually (docs/RELEASING.md).

permissions:
  contents: write

on:
  push:
    tags:
      # Bare semantic versions, no "v" prefix (matching porymap): 1.0.0
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  # Creates the release up front so the per-platform jobs only ever attach
  # files to it (avoids concurrent-creation races), and gates them on the
  # tag matching the source of truth.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the CMake project version
        run: |
          cmake_version="$(sed -n 's/^project(porydaw VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [ "$cmake_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CMakeLists.txt project version $cmake_version" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: tools/extract_changelog.sh "$GITHUB_REF_NAME" > release-notes.md

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: create-release
    # Pinned to the oldest supported runner: AppImages never bundle glibc, so
    # the build machine's glibc is the artifact's compatibility floor. Building
    # on 22.04 (glibc 2.35) keeps the AppImage runnable on 22.04-era distros;
    # ubuntu-latest (24.04, glibc 2.39) produced binaries that fail there.
    runs-on: ubuntu-22.04
    env:
      BUILD_NAME: porydaw-linux
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          cache: true

      - name: Install ALSA headers (MIDI input)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Package AppImage
        # linuxdeploy bundles Qt (libraries + platform plugins) into a
        # self-contained AppImage. APPIMAGE_EXTRACT_AND_RUN avoids needing
        # FUSE on the runner.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          VERSION: ${{ github.ref_name }}
        run: |
          curl -fLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -e build/porydaw \
            -d resources/porydaw.desktop \
            -i resources/porydaw.png \
            --plugin qt \
            --output appimage

      - name: Prep Release Directory
        run: |
          mkdir "$BUILD_NAME"
          mv porydaw-*.AppImage "$BUILD_NAME/porydaw.AppImage"
          cp RELEASE-README.txt "$BUILD_NAME/README.txt"
          zip -r "$BUILD_NAME.zip" "$BUILD_NAME"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: porydaw-linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    env:
      BUILD_NAME: porydaw-macos-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build -j3

      - name: Create Disk Image
        # macdeployqt adds Qt frameworks/plugins to the bundle, which breaks
        # the ad-hoc signature the linker gave the binary; Gatekeeper then
        # refuses the app ("code has no resources but signature indicates
        # they must be present"). -codesign=- re-signs the whole bundle
        # ad-hoc after deployment, before the dmg is built. The verify step
        # fails the job if the seal is still broken.
        #
        # The dmg is built with hdiutil rather than macdeployqt -dmg so the
        # window that opens on mount also shows "RUN AFTER INSTALL.txt" (the
        # quarantine-removal instructions users must see, deliberately not
        # named README) and an /Applications shortcut for drag-install.
        # hdiutil create is occasionally flaky on CI runners ("resource
        # busy"), hence the retry loop.
        run: |
          macdeployqt build/porydaw.app -codesign=-
          codesign --verify --deep --strict --verbose=2 build/porydaw.app
          mkdir dmg-root
          cp -R build/porydaw.app dmg-root/
          cp "RUN AFTER INSTALL.txt" dmg-root/
          ln -s /Applications dmg-root/Applications
          created=
          for attempt in 1 2 3; do
            if hdiutil create -volname porydaw -srcfolder dmg-root -ov \
                -format UDZO build/porydaw.dmg; then
              created=1
              break
            fi
            sleep 5
          done
          [ -n "$created" ]

      - name: Prep Release Directory
        run: |
          mkdir "$BUILD_NAME"
          cp build/porydaw.dmg "$BUILD_NAME/porydaw.dmg"
          cp RELEASE-README.txt "$BUILD_NAME/README.txt"
          zip -r "$BUILD_NAME.zip" "$BUILD_NAME"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BUILD_NAME }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
